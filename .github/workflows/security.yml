name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt

  secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----|ghp_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})' -- ':!docs/' ':!README.md'; then
            echo 'Potential credential pattern detected.'
            exit 1
          fi
