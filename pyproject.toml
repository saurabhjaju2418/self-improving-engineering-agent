[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-engineering-agent"
version = "0.2.0"
description = "A secure, Git-native self-improving engineering agent for Claude Code"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.23,<5"]

[project.scripts]
siea = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
